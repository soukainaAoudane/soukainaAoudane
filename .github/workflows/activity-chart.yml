
name: Update activity chart

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate charts
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          default-days: '365'
          ranges: '365'
          layout: spacious
          output-dir: activity-dist

      - name: Apply navy pink lavender theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("activity-dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")

              # Navy background and pink/lavender accents.
              svg = re.sub(
                  r'(<svg\b[^>]*\bstyle="[^"]*)',
                  lambda m: m.group(1),
                  svg
              )

              # Replace common default chart colors.
              colors = {
                  "#0d1117": "#191B35",
                  "#161b22": "#191B35",
                  "#21262d": "#191B35",
                  "#0969da": "#F6A6C8",
                  "#1f6feb": "#F6A6C8",
                  "#58a6ff": "#C4B5FD",
                  "#2da44e": "#F6A6C8",
                  "#3fb950": "#F6A6C8",
                  "#238636": "#C4B5FD",
              }

              for old, new in colors.items():
                  svg = re.sub(
                      re.escape(old),
                      new,
                      svg,
                      flags=re.IGNORECASE
                  )

              path.write_text(svg, encoding="utf-8")
              print(f"Customized: {path}")
          PY

      - name: Publish charts
        env:
          TARGET_BRANCH: activity-assets
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -a activity-dist/. "$temp_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$TARGET_BRANCH"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git add -A
          git commit -m "Update activity charts"
          git push --force origin "$TARGET_BRANCH"
