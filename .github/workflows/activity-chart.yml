
name: Update activity chart

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate charts
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          default-days: '365'
          ranges: '365'
          layout: spacious
          output-dir: activity-dist

      
      - name: Apply navy pink lavender theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              "#0d1117": "#191B35",
              "#111821": "#222443",
              "#30363d": "#C4B5FD",
              "#21262d": "#383858",
              "#f0f6fc": "#FCE7F0",
              "#8b949e": "#C4B5FD",
              "#39d353": "#F6A6C8",
              "#58a6ff": "#C4B5FD",
              "#56d364": "#F6A6C8",
              "rgba(57, 211, 83, 0.24)": "rgba(246, 166, 200, 0.24)",
              "rgba(57, 211, 83, 0.015)": "rgba(246, 166, 200, 0.015)",
          }

          for path in Path("activity-dist").glob("*.svg"):
              svg = path.read_text(encoding="utf-8")

              for old, new in replacements.items():
                  svg = re.sub(
                      re.escape(old),
                      lambda _: new,
                      svg,
                      flags=re.IGNORECASE
                  )

              path.write_text(svg, encoding="utf-8")
              print(f"Applied custom colors: {path}")
          PY


      - name: Publish charts
        env:
          TARGET_BRANCH: activity-assets
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -a activity-dist/. "$temp_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$TARGET_BRANCH"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git add -A
          git commit -m "Update activity charts"
          git push --force origin "$TARGET_BRANCH"
